spring:
  datasource:
    # MySQL 8
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/essay_system_v4?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 1234

    # Druid
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

      filters: stat,wall

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # SpringAI DeepSeek 配置（使用 OpenAI 兼容接口）
  ai:
    openai:
      api-key: sk-ec558b259ac44d2b870693e12555ee96  # DeepSeek API Key
      base-url: https://api.deepseek.com  # DeepSeek API 地址
      chat:
        options:
          model: deepseek-chat  # 模型名称
          temperature: 0.7      # 温度参数
          max-tokens: 4096       # 最大 token 数（DeepSeek 当前允许范围 [1, 8192]，适当留余量）
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: Admin@123
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      timeout: 3000ms

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: 12345678
  bucket-name: essayandfile

# OCR 服务配置
ocr:
  service:
    url: http://127.0.0.1:8000  # FastAPI OCR 服务地址

# 文本纠错服务配置
correct:
  service:
    url: http://127.0.0.1:8001  # 文本纠错服务地址
    enabled: true  # 是否启用文本纠错服务
    timeout: 60000  # 超时时间（毫秒），默认60秒

# DeepSeek API 配置（保留用于兼容，已迁移到 SpringAI）
deepseek:
  api:
    url: https://api.deepseek.com/v1/chat/completions  # DeepSeek API 地址
    key: sk-ec558b259ac44d2b870693e12555ee96  # 请替换为您的 DeepSeek API Key
    model: deepseek-chat  # 使用的模型名称（deepseek-chat 是官方标准模型，可能已包含 V3 版本能力）

# 文件上传配置
file:
  upload:
    base-path: uploads
    image-path: essay/images
    document-path: essay/documents
    allowed-image-types: jpg,jpeg,png
    allowed-document-types: doc,docx,pdf,txt
    max-file-size: 52428800  # 50MB

# 评审规则配置
review:
  rule:
    version: v1.0  # 评分规则版本
  mq:
    exchange: review.direct
    queue: review.grading.queue
    routing-key: review.grading
  cache:
    status-ttl-minutes: 60
    detail-ttl-minutes: 120
    lock-ttl-minutes: 15

# 日志配置（生产环境建议改为 INFO）
logging:
  level:
    com.jhddt: info  # 临时改为 DEBUG 以便排查文本纠错问题
    com.jhddt.module.review.service.ReviewService: DEBUG
    com.jhddt.module.review.mapper: DEBUG  # 添加 Mapper 日志
    org.springframework.security: WARN

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 语句

# JWT 配置
jwt:
  expiration: 7200000  # Token 过期时间（毫秒），2小时 = 2 * 60 * 60 * 1000

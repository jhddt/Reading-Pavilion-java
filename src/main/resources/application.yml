spring:
  datasource:
    # MySQL 8
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/essay_system_v2?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 1234

    # Druid
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

      filters: stat,wall

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # SpringAI DeepSeek 配置（使用 OpenAI 兼容接口）
  ai:
    openai:
      api-key: sk-ec558b259ac44d2b870693e12555ee96  # DeepSeek API Key
      base-url: https://api.deepseek.com  # DeepSeek API 地址
      chat:
        options:
          model: deepseek-chat  # 模型名称
          temperature: 0.7      # 温度参数
          max-tokens: 2000       # 最大 token 数

# MinIO 配置
minio:
  endpoint: http://192.168.41.128:9000
  access-key: admin
  secret-key: 12345678
  bucket-name: essayandfile

# OCR 服务配置
ocr:
  service:
    url: http://0.0.0.0:8000  # FastAPI OCR 服务地址

# DeepSeek API 配置（保留用于兼容，已迁移到 SpringAI）
deepseek:
  api:
    url: https://api.deepseek.com/v1/chat/completions  # DeepSeek API 地址
    key: sk-ec558b259ac44d2b870693e12555ee96  # 请替换为您的 DeepSeek API Key
    model: deepseek-chat  # 使用的模型名称（deepseek-chat 是官方标准模型，可能已包含 V3 版本能力）

# 文件上传配置
file:
  upload:
    base-path: uploads
    image-path: essay/images
    document-path: essay/documents
    allowed-image-types: jpg,jpeg,png
    allowed-document-types: doc,docx,pdf,txt
    max-file-size: 10485760  # 10MB

# 评审规则配置
review:
  rule:
    version: v1.0  # 评分规则版本

# 日志配置（生产环境建议改为 INFO）
logging:
  level:
    com.jhddt: INFO
    org.springframework.security: WARN